# isle-whisper builds whisper.cpp's ggml, which whisper-rs-sys configures from GGML_* variables.
# Not for this computer's processor alone (GGML_NATIVE), so a release runs on any x86-64 with
# AVX2 and FMA; set GGML_NATIVE=ON in the environment to tune a build for your own.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"

# sherpa-onnx (speech to text) comes as libraries built with the static C runtime: Isle links it the same way,
# which also leaves isle.exe needing no Visual C++ runtime installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
