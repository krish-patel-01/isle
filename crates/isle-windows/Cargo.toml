[package]
name = "isle-windows"
description = "Isle for Windows: the island as an always-on-top window at the top of the screen"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "isle"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
# Serves `ui/` from inside the executable (Tauri's production mode).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
isle-core.workspace = true

anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
ureq.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "ApplicationModel",
    "ApplicationModel_Appointments",
    "UI_Notifications",
    "UI_Notifications_Management",
    "UI",
] }
