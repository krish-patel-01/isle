[package]
name = "isle-windows"
description = "Isle for Windows: the island as an always-on-top window at the top of the screen"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "isle"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
# Serves `ui/` from inside the executable (Tauri's production mode).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
isle-core.workspace = true

anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
image = { workspace = true, features = ["bmp", "jpeg", "gif", "webp"] }
httparse.workspace = true
md5.workspace = true
qrcode.workspace = true
regex = "1"
# Speech to text on this computer (dictation, the assistant), linked in whole.
sherpa-onnx = "2.0.1"
subtle.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
drag = "2.1"
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
ureq.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"

[dev-dependencies]
# Paused clocks, for phone sharing's tests (isled's, run here too).
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
# For the island's drop zone, a COM drop target of Isle's own (`#[implement]` names this crate).
windows-core = "0.61"
# The lists WinRT takes and gives (paired Bluetooth devices).
windows-collections = "0.2"
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Enumeration",
    "Devices_Bluetooth",
    "Devices_Radios",
    "Win32_System_Shutdown",
    "Networking_Connectivity",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "ApplicationModel",
    "ApplicationModel_Appointments",
    "UI_Notifications",
    "UI_Notifications_Management",
    "UI",
] }
